<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartNotify</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="brand"><span class="logo">✳</span><h1>SmartNotify</h1></div>
      <div id="serverStatus" class="server muted" aria-live="polite">Не підключено</div>
    </header>

    <section class="panel model-panel">
      <div class="model-line">
        <div class="model-select-wrap"><label for="model">Модель</label><select id="model" aria-label="Локальна модель Ollama"></select></div>
        <div class="context-select-wrap"><label for="context">Контекст</label><select id="context" aria-label="Розмір контексту">
          <option value="1024">1024</option>
          <option value="1536">1536</option>
          <option value="2048">2048</option>
          <option value="3072">3072</option>
          <option value="4096" selected>4096</option>
          <option value="8192">8192</option>
        </select></div>
        <button id="refreshModels" class="icon-button" type="button" title="Оновити моделі" aria-label="Оновити моделі">↻</button>
        <button id="connectBtn" class="secondary connect-btn" type="button">Підключити</button>
      </div>
    </section>

    <section class="panel">
      <label for="sender">Відправник</label>
      <input id="sender" maxlength="120" placeholder="Наприклад, колега" autocomplete="off">
      <label for="message">Повідомлення</label>
      <textarea id="message" maxlength="4000" rows="5" placeholder="Встав повідомлення…"></textarea>
      <div class="actions">
        <button type="button" id="classifyBtn" class="primary">Аналізувати</button>
        <label class="toggle"><input type="checkbox" id="autoReply"> <span>Автоматично створювати чернетку</span></label>
      </div>
    </section>

    <details class="settings panel" id="settings">
      <summary>Налаштування моделі</summary>
      <div class="settings-content">
        <div class="setting">
          <div class="setting-label"><label for="classifierTemperature">Температура аналізу</label><output id="classifierTemperatureValue">0.0</output></div>
          <input type="range" id="classifierTemperature" min="0" max="1" step="0.1" value="0">
        </div>
        <div class="setting">
          <div class="setting-label"><label for="replyTemperature">Температура чернетки</label><output id="replyTemperatureValue">0.0</output></div>
          <input type="range" id="replyTemperature" min="0" max="1" step="0.1" value="0">
        </div>
        <div class="setting">
          <div class="setting-label"><label for="maxTokens">Ліміт токенів</label><output id="maxTokensValue">220</output></div>
          <input type="range" id="maxTokens" min="64" max="320" step="4" value="220">
        </div>
      </div>
    </details>

    <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>

    <section id="result" class="panel result hidden" aria-live="polite">
      <div class="result-title"><h2>Результат</h2><span id="urgency" class="pill"></span></div>
      <p id="reason" class="reason"></p>
      <div class="separator"></div>
      <div class="reply-title"><h2>Чернетка</h2><button id="replyBtn" type="button" class="secondary">Згенерувати</button></div>
      <textarea id="reply" rows="3" placeholder="Натисни «Згенерувати»" aria-label="Чернетка відповіді"></textarea>
      <div class="reply-controls"><button id="copyBtn" type="button" class="text-button">Копіювати</button><span class="hint">Редагується перед надсиланням</span></div>
      <details class="metrics"><summary>Метрики / JSON</summary><pre id="metricsText"></pre></details>
    </section>
  </main>
</body>
</html>
